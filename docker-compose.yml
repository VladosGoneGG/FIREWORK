services:
  backend:
    # Expects the api-salutka repo checked out as a sibling of this one:
    #   some-folder/
    #     FIREWORK-original/   <- this repo (docker compose runs from here)
    #     api-salutka/
    build: ../api-salutka
    environment:
      - PORT=3000
      - NODE_ENV=production
      - API_KEY=${API_KEY}
      - FTP_DATA_DIR=${FTP_DATA_DIR:-/var/ftp/data}
      - RETAIL_CSV_FILE=${RETAIL_CSV_FILE:-РОЗНИЦА_сайт_пример.csv}
      - WHOLESALE_XLSX_FILE=${WHOLESALE_XLSX_FILE:-ОПТОВЫЕ цены_сайт_пример.xlsx}
    volumes:
      # Named volume seeded from the image's ./data on first run, then
      # persists products.json across deploys.
      - backend_data:/app/data
      # Read-only view of the vsftpd dropbox (local user "exchange",
      # chrooted to /var/ftp) — the backend only ever reads the retail CSV
      # and wholesale XLSX from here, never writes/renames/deletes.
      - /var/ftp/data:/var/ftp/data:ro
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_BASE_PATH: /
        VITE_TELEGRAM_BOT_TOKEN: ${VITE_TELEGRAM_BOT_TOKEN:-}
        VITE_TELEGRAM_CHAT_ID: ${VITE_TELEGRAM_CHAT_ID:-}
    environment:
      - DOMAIN=${DOMAIN:-salutxprime.ru}
      - API_KEY=${API_KEY}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  caddy_data:
  caddy_config:
