<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="/src/index.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<!--
			The tags below (including <title>) are the no-JS fallback for crawlers/social-bots
			that don't execute React (Helmet only updates the live DOM, so it can't help them).
			Once React mounts, main.jsx removes every data-default-seo tag and react-helmet-async
			takes over with per-route values — see src/components/Seo/Seo.jsx. Keep these in sync.
		-->
		<title data-default-seo>Салюты — фейерверки и пиротехника в Нижнем Новгороде</title>
		<meta
			data-default-seo
			name="description"
			content="Магазин салютов и фейерверков в Нижнем Новгороде: каталог пиротехники, самовывоз и доставка, розница и опт."
		/>
		<link data-default-seo rel="canonical" href="https://vladosgonegg.github.io/FIREWORK/" />

		<meta data-default-seo property="og:type" content="website" />
		<meta data-default-seo property="og:site_name" content="Салюты" />
		<meta data-default-seo property="og:title" content="Салюты — фейерверки и пиротехника в Нижнем Новгороде" />
		<meta
			data-default-seo
			property="og:description"
			content="Магазин салютов и фейерверков в Нижнем Новгороде: каталог пиротехники, самовывоз и доставка, розница и опт."
		/>
		<meta data-default-seo property="og:url" content="https://vladosgonegg.github.io/FIREWORK/" />

		<meta data-default-seo name="twitter:card" content="summary" />
		<meta data-default-seo name="twitter:title" content="Салюты — фейерверки и пиротехника в Нижнем Новгороде" />
		<meta
			data-default-seo
			name="twitter:description"
			content="Магазин салютов и фейерверков в Нижнем Новгороде: каталог пиротехники, самовывоз и доставка, розница и опт."
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
